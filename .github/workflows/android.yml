name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"

      - name: Test, lint and assemble debug
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: codex-pet-android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare release signing
        id: release_signing
        if: github.event_name != 'pull_request'
        env:
          CODEX_PET_KEYSTORE_BASE64: ${{ secrets.CODEX_PET_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$CODEX_PET_KEYSTORE_BASE64" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are not configured; debug APK remains available."
            exit 0
          fi
          echo "$CODEX_PET_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/codex-pet-release.jks"
          echo "path=$RUNNER_TEMP/codex-pet-release.jks" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Assemble signed release
        if: steps.release_signing.outputs.ready == 'true'
        env:
          CODEX_PET_KEYSTORE_PATH: ${{ steps.release_signing.outputs.path }}
          CODEX_PET_KEYSTORE_PASSWORD: ${{ secrets.CODEX_PET_KEYSTORE_PASSWORD }}
          CODEX_PET_KEY_ALIAS: ${{ secrets.CODEX_PET_KEY_ALIAS }}
          CODEX_PET_KEY_PASSWORD: ${{ secrets.CODEX_PET_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify release signature
        if: steps.release_signing.outputs.ready == 'true'
        run: apksigner verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Upload signed release APK
        if: steps.release_signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: codex-pet-android-release-signed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
