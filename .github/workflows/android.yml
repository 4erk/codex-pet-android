name: Android CI and Release

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  EXPECTED_APPLICATION_ID: com.mr4erk.codexpet
  EXPECTED_RELEASE_CERT_SHA256: d6200054b397e388146862d605d0aeea3c98f43af5040d7cef2ac274095a9b96

jobs:
  verify:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"

      - name: Unit tests, lint and debug APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Assemble minified release candidate
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify built APK package identities
        run: |
          set -euo pipefail
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1)"
          test -f "$DEBUG_APK"
          test -n "$RELEASE_APK" && test -f "$RELEASE_APK"
          DEBUG_ID="$(apkanalyzer manifest application-id "$DEBUG_APK" | tr -d '\r')"
          RELEASE_ID="$(apkanalyzer manifest application-id "$RELEASE_APK" | tr -d '\r')"
          test "$DEBUG_ID" = "${EXPECTED_APPLICATION_ID}.debug" || {
            echo "::error::Unexpected debug applicationId: $DEBUG_ID"
            exit 1
          }
          test "$RELEASE_ID" = "$EXPECTED_APPLICATION_ID" || {
            echo "::error::Unexpected release applicationId: $RELEASE_ID"
            exit 1
          }

      - name: Upload debug diagnostics APK
        uses: actions/upload-artifact@v4
        with:
          name: codex-pet-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned minified release candidate
        uses: actions/upload-artifact@v4
        with:
          name: codex-pet-release-candidate-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"

      - name: Validate production signing secrets
        env:
          CODEX_PET_KEYSTORE_BASE64: ${{ secrets.CODEX_PET_KEYSTORE_BASE64 }}
          CODEX_PET_KEYSTORE_PASSWORD: ${{ secrets.CODEX_PET_KEYSTORE_PASSWORD }}
          CODEX_PET_KEY_ALIAS: ${{ secrets.CODEX_PET_KEY_ALIAS }}
          CODEX_PET_KEY_PASSWORD: ${{ secrets.CODEX_PET_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for value in CODEX_PET_KEYSTORE_BASE64 CODEX_PET_KEYSTORE_PASSWORD CODEX_PET_KEY_ALIAS CODEX_PET_KEY_PASSWORD; do
            if [ -z "${!value:-}" ]; then
              echo "::error::Required production secret $value is missing"
              missing=1
            fi
          done
          test "$missing" -eq 0
          echo "$CODEX_PET_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/codex-pet-release.jks"
          test -s "$RUNNER_TEMP/codex-pet-release.jks"

      - name: Assemble signed production release
        env:
          CODEX_PET_KEYSTORE_PATH: ${{ runner.temp }}/codex-pet-release.jks
          CODEX_PET_KEYSTORE_PASSWORD: ${{ secrets.CODEX_PET_KEYSTORE_PASSWORD }}
          CODEX_PET_KEY_ALIAS: ${{ secrets.CODEX_PET_KEY_ALIAS }}
          CODEX_PET_KEY_PASSWORD: ${{ secrets.CODEX_PET_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify identity, signing certificate and checksum
        id: release_meta
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)"
          test -n "$VERSION"
          NOTES="docs/releases/${VERSION}.md"
          test -f "$NOTES" || { echo "::error::Missing release notes $NOTES"; exit 1; }
          SOURCE="app/build/outputs/apk/release/app-release.apk"
          test -f "$SOURCE"

          PACKAGE_ID="$(apkanalyzer manifest application-id "$SOURCE" | tr -d '\r')"
          test "$PACKAGE_ID" = "$EXPECTED_APPLICATION_ID" || {
            echo "::error::Production APK applicationId is $PACKAGE_ID, expected $EXPECTED_APPLICATION_ID"
            exit 1
          }

          CERT_OUTPUT="$(apksigner verify --verbose --print-certs "$SOURCE")"
          printf '%s\n' "$CERT_OUTPUT"
          CERT_SHA="$(printf '%s\n' "$CERT_OUTPUT" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
            | head -n1 \
            | tr '[:upper:]' '[:lower:]' \
            | tr -d ':[:space:]')"
          test -n "$CERT_SHA" || { echo "::error::Could not read signer SHA-256"; exit 1; }
          test "$CERT_SHA" = "$EXPECTED_RELEASE_CERT_SHA256" || {
            echo "::error::Wrong production signing certificate SHA-256: $CERT_SHA"
            exit 1
          }

          OUT="$RUNNER_TEMP/release"
          mkdir -p "$OUT"
          APK_NAME="codex-pet-${VERSION}.apk"
          cp "$SOURCE" "$OUT/$APK_NAME"
          (cd "$OUT" && sha256sum "$APK_NAME" > "$APK_NAME.sha256")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk=$OUT/$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "checksum=$OUT/$APK_NAME.sha256" >> "$GITHUB_OUTPUT"
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Upload signed production artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-pet-${{ steps.release_meta.outputs.version }}-signed
          path: |
            ${{ steps.release_meta.outputs.apk }}
            ${{ steps.release_meta.outputs.checksum }}
          if-no-files-found: error
          retention-days: 90

      - name: Publish immutable GitHub stable Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_meta.outputs.tag }}
          VERSION: ${{ steps.release_meta.outputs.version }}
          APK: ${{ steps.release_meta.outputs.apk }}
          CHECKSUM: ${{ steps.release_meta.outputs.checksum }}
          NOTES: ${{ steps.release_meta.outputs.notes }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Stable release $TAG already exists; keeping it immutable."
            exit 0
          fi
          gh release create "$TAG" "$APK" "$CHECKSUM" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Codex Pet $VERSION" \
            --notes-file "$NOTES"
